<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabète Soft - Presentation</title>
    <style>
        /* RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0D0D0D;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 20px;
            overflow: hidden; /* Empêche le scroll */
        }

        /* HEADLINE */
        .headline {
            text-align: center;
            max-width: 900px;
        }

        .headline h1 {
            font-size: 28px;
            line-height: 1.2;
            margin-bottom: 10px;
            background: linear-gradient(to bottom, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .headline span {
            color: #27AE60;
            -webkit-text-fill-color: #27AE60;
        }

        /* VIDEO CONTAINER */
        .video-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(39, 174, 96, 0.1);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* CTA AREA */
        .cta-area {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 18px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.5s ease;
        }

        /* Bouton bloqué */
        .btn-locked {
            background-color: transparent;
            color: #555;
            border: 1px solid #333;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Bouton activé */
        .btn-active {
            background-color: #1E8449;
            color: white;
            border: none;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(30, 132, 73, 0.4);
            animation: pulse 2s infinite;
        }

        .timer-text {
            font-family: monospace;
            color: #27AE60;
            font-size: 20px;
        }

        .hint {
            margin-top: 15px;
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .headline h1 { font-size: 20px; }
            .btn { font-size: 15px; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="headline">
        <h1>Ahoana no fampidinana ny HbA1c anao ho 5,7 tao anatin'ny 23 andro...<br>
        <span>nefa tsy manova fanafody.</span></h1>
    </div>

    <div class="video-container">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/QxHHjW58T2w?si=uo6gDsYZwa9-sQb_&rel=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <div class="cta-area">
        <div id="cta-box" class="btn btn-locked">
            <span id="btn-label">Hovahana afaka</span>
            <span id="timer" class="timer-text">17:54</span>
        </div>
        <p id="hint" class="hint">Tohizo ny fijerena ny horonantsary hahazoana ny tolotra</p>
    </div>

    <script>
        // Configuration : 17 minutes et 54 secondes = 1074 secondes
        let timeLeft = 1074; 
        const timerDisplay = document.getElementById('timer');
        const ctaBox = document.getElementById('cta-box');
        const btnLabel = document.getElementById('btn-label');
        const hint = document.getElementById('hint');

        const countdown = setInterval(() => {
            timeLeft--;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                unlockButton();
            } else {
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                timerDisplay.innerText = 
                    (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
            }
        }, 1000);

        function unlockButton() {
            // Transforme le div en lien cliquable
            const link = document.createElement('a');
            link.href = "page-de-vente.html"; // Mets ton lien ici
            link.className = "btn btn-active";
            link.innerHTML = "📲 Raiso ny Guide Diabète Soft";
            
            ctaBox.parentNode.replaceChild(link, ctaBox);
            
            hint.innerText = "✅ Efa vonona ny tolotra ho anao";
            hint.style.color = "#27AE60";
        }
    </script>

</body>
</html>
