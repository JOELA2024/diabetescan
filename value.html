<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabète Soft - Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'DM Sans', sans-serif; 
            background-color: #0D0D0D; 
            height: 100vh; 
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }
        h1 { font-family: 'Playfair Display', serif; }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* Bouton Minimaliste Verrouillé */
        .btn-locked {
            background-color: transparent !important;
            color: #4b5563 !important;
            border: 1px solid #374151;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Animation quand activé */
        .btn-active {
            animation: pulse-simple 2s infinite;
        }
        @keyframes pulse-simple {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="text-white py-6 px-4 items-center justify-between">

    <div class="max-w-4xl text-center">
        <h1 class="text-2xl md:text-5xl font-black leading-tight bg-gradient-to-b from-white to-gray-400 bg-clip-text text-transparent">
            Ahoana no fampidinana ny HbA1c anao ho 5,7 tao anatin'ny 23 andro... <br class="hidden md:block">
            <span class="text-[#27AE60]">nefa tsy manova fanafody.</span>
        </h1>
    </div>

    <div class="video-container rounded-3xl shadow-2xl border border-white/5 overflow-hidden">
        <div id="player"></div>
    </div>

    <div id="cta-container" class="w-full max-w-lg text-center">
        <a href="page-de-vente.html" id="cta-button" class="btn-locked flex items-center justify-center gap-4 w-full py-5 rounded-full text-lg font-bold uppercase transition-all duration-700">
            <span id="cta-text">Hovahana afaka</span>
            <span id="timer" class="font-mono text-[#27AE60]">17:54</span>
        </a>
        
        <p id="timer-hint" class="mt-4 text-gray-400 text-[10px] uppercase tracking-[0.2em] font-bold">
            Henoy ny fanazavana vao afaka mandray ny tolotra
        </p>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var isUnlocked = false;

        // --- CONFIGURATION ---
        const VIDEO_ID = 'QxHHjW58T2w'; 
        const TEMPS_ACTIVATION = 1020; // 17 minutes x 60 secondes
        // ---------------------

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: VIDEO_ID,
                playerVars: { 
                    'rel': 0, 
                    'modestbranding': 1, 
                    'controls': 1,
                    'origin': window.location.origin 
                },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                setInterval(updateCtaProgress, 1000);
            }
        }

        function updateCtaProgress() {
            if (isUnlocked) return;
            var currentTime = player.getCurrentTime();
            var timeLeft = Math.max(0, TEMPS_ACTIVATION - Math.floor(currentTime));

            if (timeLeft > 0) {
                var mins = Math.floor(timeLeft / 60);
                var secs = timeLeft % 60;
                document.getElementById('timer').innerHTML = (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
            } else {
                unlockCTA();
            }
        }

        function unlockCTA() {
            isUnlocked = true;
            const btn = document.getElementById('cta-button');
            const hint = document.getElementById('timer-hint');
            
            btn.classList.remove('btn-locked');
            btn.classList.add('bg-[#1E8449]', 'text-white', 'btn-active', 'border-none', 'shadow-[0_0_40px_rgba(39,174,96,0.4)]');
            btn.style.pointerEvents = "auto";
            
            document.getElementById('cta-text').innerText = "📲 Raiso ny Guide Diabète Soft";
            document.getElementById('timer').style.display = "none";
            
            hint.innerText = "✅ Efa vonona ny tolotra ho anao";
            hint.classList.replace('text-gray-500', 'text-green-500');
        }
    </script>
</body>
</html>
